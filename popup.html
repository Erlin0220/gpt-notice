<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT 任务提醒</title><link rel="stylesheet" href="popup.css"></head><body><main><header><img class="logo" src="icons/chatgpt.png" alt="ChatGPT"><div><h1>ChatGPT 任务提醒</h1><p id="summary">正在读取任务状态…</p></div></header><section id="permissionWarning" class="warning hidden">Chrome 或 Windows 已关闭扩展通知，请在系统通知设置中允许 Chrome 通知。</section><section class="diagnostics" aria-labelledby="diagnosticsTitle"><div class="section-title"><h2 id="diagnosticsTitle">诊断中心</h2><span id="diagnosticFeedback" class="feedback" aria-live="polite"></span></div><div class="health-grid"><article class="health-card"><span>页面兼容性</span><strong id="pageHealth" class="health unknown">读取中</strong><small id="pageReason">正在检查当前页面</small></article><article class="health-card"><span>通知权限</span><strong id="notificationHealth" class="health unknown">读取中</strong><small id="notificationReason">正在读取权限</small></article><article class="health-card"><span>活动任务</span><strong id="taskHealth" class="health unknown">读取中</strong><small id="taskReason">正在汇总任务</small></article><article class="health-card"><span>消息队列</span><strong id="queueHealth" class="health unknown">读取中</strong><small id="queueReason">正在汇总队列</small></article></div><div class="diagnostic-actions"><button id="copyDiagnosticsButton" class="primary">复制诊断信息</button><button id="downloadDiagnosticsButton">下载诊断 JSON</button><button id="clearDiagnosticsButton">清除诊断记录</button></div><textarea id="manualCopyText" class="manual-copy hidden" readonly aria-label="可手动复制的诊断信息"></textarea><p class="privacy-note">诊断仅存本机，不含聊天正文、Cookie、Token、完整 URL 或原始会话 ID。</p></section><section class="panel settings"><label><span>任务完成提醒</span><input type="checkbox" data-setting="notifyCompleted"></label><label><span>等待操作提醒</span><input type="checkbox" data-setting="notifyAttention"></label><label><span>任务失败提醒</span><input type="checkbox" data-setting="notifyFailed"></label><label><span>ChatGPT 在前台时也提醒</span><input type="checkbox" data-setting="notifyWhenFocused"></label></section><div class="actions"><button id="testButton" class="primary">测试 Windows 通知</button><button id="openChatButton">打开 ChatGPT</button></div><section class="task-section"><div class="section-title"><h2>最近任务</h2><button id="clearButton" class="text-button">清理记录</button></div><div id="taskList" class="task-list"></div></section><footer>只监控仍打开的 ChatGPT 页面；关闭页面后停止，不创建后台标签。</footer></main><script src="popup.js"></script></body></html>
