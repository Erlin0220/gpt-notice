name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          npm test
          npm run e2e:smoke
          python3 -m json.tool manifest.json >/dev/null
          test -s icons/chatgpt.png
      - name: Package tested source
        shell: bash
        run: |
          mkdir -p artifact/chatgpt-task-notifier
          rsync -a ./ artifact/chatgpt-task-notifier/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='artifact/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='node_modules/' \
            --exclude='.test-profile/' \
            --exclude='.playwright-cli/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.js' \
            --exclude='.gitignore'
      - uses: actions/upload-artifact@v4
        with:
          name: extension-under-test
          path: artifact/chatgpt-task-notifier
          if-no-files-found: error
