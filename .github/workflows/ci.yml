name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          npm test
          npm run e2e:smoke
          python3 -m json.tool manifest.json >/dev/null
          test -s icons/chatgpt.png
      - name: Package tested source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -rf artifact
          mkdir -p artifact/chatgpt-task-notifier
          cp -a dist/. artifact/chatgpt-task-notifier/
      - uses: actions/upload-artifact@v4
        with:
          name: extension-under-test
          path: artifact/chatgpt-task-notifier
          if-no-files-found: error
