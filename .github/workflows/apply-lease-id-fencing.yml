name: Apply lease id fencing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/conversation-lease-instance-guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conversation-lease-instance-guard
          fetch-depth: 0

      - name: Fence stale refresh and release calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('queue-v060.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '  function isCurrentLeaseOwner(lease) {\n    return Boolean(lease && lease.ownerTabId === runtime.tabId && lease.ownerInstanceId === runtime.instanceId && lease.ownerQueueKey === runtime.queueKey);\n  }\n',
                  '  function isCurrentLeaseOwner(lease, expectedLeaseId = "") {\n    return leaseGuard.isLeaseOwner(lease, {\n      tabId: runtime.tabId,\n      instanceId: runtime.instanceId,\n      queueKey: runtime.queueKey\n    }, expectedLeaseId);\n  }\n'
              ),
              (
                  '      const current = normalizeConversationLease(leases[runtime.conversationKey]);\n      if (!isCurrentLeaseOwner(current)) {\n        runtime.conversationLease = current;\n        return;\n      }\n      const next = { ...current, ownerInstanceId: runtime.instanceId, ownerQueueKey: runtime.queueKey, expiresAt: now + LEASE_TTL_MS };\n',
                  '      const current = normalizeConversationLease(leases[runtime.conversationKey]);\n      if (!isCurrentLeaseOwner(current, runtime.conversationLease?.leaseId)) {\n        runtime.conversationLease = current;\n        return;\n      }\n      const next = { ...current, ownerInstanceId: runtime.instanceId, ownerQueueKey: runtime.queueKey, expiresAt: now + LEASE_TTL_MS };\n'
              ),
              (
                  '  function releaseCurrentLease() { void releaseLease(runtime.conversationKey); }\n  async function releaseLease(conversationKey) {\n',
                  '  function releaseCurrentLease() { void releaseLease(runtime.conversationKey, runtime.conversationLease?.leaseId); }\n  async function releaseLease(conversationKey, expectedLeaseId = runtime.conversationLease?.leaseId) {\n'
              ),
              (
                  '      const current = normalizeConversationLease(leases[conversationKey]);\n      if (!isCurrentLeaseOwner(current)) return;\n      delete leases[conversationKey];\n',
                  '      const current = normalizeConversationLease(leases[conversationKey]);\n      if (!isCurrentLeaseOwner(current, expectedLeaseId)) return;\n      delete leases[conversationKey];\n'
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/static.test.js')
          test_source = test_path.read_text(encoding='utf-8')
          old = '''assert.ok(queue.includes("isCurrentLeaseOwner"), "lease refresh and release must verify the exact page owner");
          assert.ok(queue.includes("lease.ownerInstanceId === runtime.instanceId"), "lease ownership must include the page instance id");
          assert.ok(queue.includes("lease.ownerQueueKey === runtime.queueKey"), "lease ownership must include the tab-scoped queue key");
          assert.ok(queue.includes("leaseGuard.compareInstanceAge"), "only a newer page document may take over a same-tab lease");
          assert.ok(queue.includes('leaseId: core.createId("lease")'), "each new conversation lease must receive a unique id");'''.replace('          ', '')
          new = '''assert.ok(leaseGuard.includes("isLeaseOwner"), "lease identity checks must be centralized and testable");
          assert.ok(leaseGuard.includes("ownerInstanceId"), "lease identity must include the page instance id");
          assert.ok(leaseGuard.includes("ownerQueueKey"), "lease identity must include the tab-scoped queue key");
          assert.ok(queue.includes("isCurrentLeaseOwner"), "lease refresh and release must verify the exact page owner");
          assert.ok(queue.includes("leaseGuard.isLeaseOwner"), "queue lease checks must use the shared exact-owner helper");
          assert.ok(queue.includes("leaseGuard.compareInstanceAge"), "only a newer page document may take over a same-tab lease");
          assert.ok(queue.includes('leaseId: core.createId("lease")'), "each new conversation lease must receive a unique id");
          assert.ok(queue.includes("expectedLeaseId"), "refresh and release operations must fence stale lease calls");
          assert.ok(queue.includes("runtime.conversationLease?.leaseId"), "the caller must provide the lease id it actually owns");'''.replace('          ', '')
          if test_source.count(old) != 1:
              raise SystemExit('static lease assertion block was not found exactly once')
          test_path.write_text(test_source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          for test_file in tests/*.test.js; do node "$test_file"; done
          python3 -m json.tool manifest.json >/dev/null

      - name: Commit fencing refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-lease-id-fencing.yml
          git add queue-v060.js tests/static.test.js
          git commit -m "fix: fence stale conversation lease operations [skip ci]"
          git push origin HEAD:fix/conversation-lease-instance-guard
