name: Auto Release

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: apply-audit-v061-existing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply_audit:
    if: github.event.issue.number == 9 && github.actor == 'Erlin0220' && github.event.comment.body == '/apply-audit-v061-existing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-audit-v061
          fetch-depth: 0

      - name: Apply verified payload
        run: python3 scripts/apply-v061-payload.py

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          for test_file in tests/*.test.js; do
            node "$test_file"
          done
          python3 -m json.tool manifest.json >/dev/null
          test -s icons/chatgpt.png
          git diff --check

      - name: Commit audited source changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/fix/comprehensive-audit-v061 -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: harden task lifecycle and queue consistency v0.6.1"
          git push origin HEAD:fix/comprehensive-audit-v061

      - name: Build extension test package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/chatgpt-task-notifier
          rsync -a ./ package/chatgpt-task-notifier/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='package/' \
            --exclude='scripts/' \
            --exclude='tests/'

      - name: Upload extension test package
        uses: actions/upload-artifact@v4
        with:
          name: extension-under-test-v0.6.1
          path: package/chatgpt-task-notifier
          if-no-files-found: error
