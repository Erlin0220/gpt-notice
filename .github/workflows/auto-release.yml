name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Read extension version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid Chrome extension version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "${{ steps.version.outputs.target_sha }}" ]]; then
            echo "Tag $TAG does not match the source being packaged; refusing a mismatched release." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ -z "$TAG_SHA" || "$TAG_SHA" != "${{ steps.version.outputs.target_sha }}" ]]; then
              echo "Release $TAG already exists but does not point to current main." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists for the current commit; publication is idempotent."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

          npm test
          npm run e2e:smoke
          python3 -m json.tool manifest.json >/dev/null
          test -s icons/chatgpt.png

      - name: Build Chrome extension package
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -rf package
          mkdir -p package/chatgpt-task-notifier
          cp -a dist/. package/chatgpt-task-notifier/
          rm -rf dist
          mkdir -p dist
          cd package
          zip -qr "../dist/chatgpt-task-notifier-v${VERSION}.zip" chatgpt-task-notifier
          cd ../dist
          sha256sum "chatgpt-task-notifier-v${VERSION}.zip" > SHA256SUMS.txt

      - name: Prepare release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGES="$(git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'- %s (`%h`)' || true)"
          else
            CHANGES="$(git log HEAD --no-merges --pretty=format:'- %s (`%h`)' || true)"
          fi
          if [[ -z "$CHANGES" ]]; then
            CHANGES="- 发布 ${TAG}"
          fi

          cat > dist/RELEASE_NOTES.md <<NOTES
          ## ChatGPT 任务完成提醒 ${TAG}

          ### 更新内容

          ${CHANGES}

          ### 安装

          1. 下载 \`chatgpt-task-notifier-v${VERSION}.zip\` 并解压。
          2. Chrome 打开 \`chrome://extensions/\`。
          3. 开启“开发者模式”。
          4. 点击“加载已解压的扩展程序”，选择解压后的文件夹。

          > 完全退出 Chrome 后，扩展无法继续监控或执行消息队列。
          NOTES

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(
            "dist/chatgpt-task-notifier-v${VERSION}.zip"
            "dist/SHA256SUMS.txt"
          )
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --latest \
              --title "ChatGPT 任务完成提醒 ${TAG}" \
              --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --latest \
              --title "ChatGPT 任务完成提醒 ${TAG}" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
          if [[ -z "$REMOTE_TAG_SHA" ]]; then
            REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
          fi
          if [[ -z "$REMOTE_TAG_SHA" || "$REMOTE_TAG_SHA" != "$TARGET_SHA" ]]; then
            echo "Remote tag $TAG does not resolve to packaged commit $TARGET_SHA" >&2
            exit 1
          fi
          gh release view "$TAG" \
            --json url,tagName,name,isDraft,isPrerelease,publishedAt,assets \
            > release-info.json
          jq -e --arg tag "$TAG" '.isDraft == false and .tagName == $tag' release-info.json >/dev/null
          jq -e --arg asset "chatgpt-task-notifier-v${VERSION}.zip" '[.assets[].name] | index($asset) != null' release-info.json >/dev/null
          jq -e '[.assets[].name] | index("SHA256SUMS.txt") != null' release-info.json >/dev/null
          rm -rf release-verify
          mkdir release-verify
          gh release download "$TAG" --dir release-verify --pattern "chatgpt-task-notifier-v${VERSION}.zip" --pattern SHA256SUMS.txt
          (cd release-verify && sha256sum -c SHA256SUMS.txt)
          cat release-info.json
