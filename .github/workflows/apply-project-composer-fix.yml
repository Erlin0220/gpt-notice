name: Apply project chat composer fix

on:
  push:
    branches:
      - fix/project-chat-active-composer

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-chat-active-composer
          fetch-depth: 0

      - name: Patch active composer selection and project route tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once('manifest.json', '"version": "0.6.6"', '"version": "0.6.7"')
          replace_once(
              'manifest.json',
              '        "queue-lease-guard.js",\n        "queue-core.js",',
              '        "queue-lease-guard.js",\n        "chatgpt-dom.js",\n        "queue-core.js",'
          )

          replace_once(
              'content.js',
              '  window.__CHATGPT_TASK_NOTIFIER_LOADED__ = true;\n\n  const COMPLETION_STABLE_MS = 4_000;',
              '  window.__CHATGPT_TASK_NOTIFIER_LOADED__ = true;\n\n  const dom = globalThis.ChatGPTDomAdapter;\n  if (!dom) return;\n\n  const COMPLETION_STABLE_MS = 4_000;'
          )
          replace_once(
              'content.js',
              '  function findComposer() {\n    return document.querySelector("#prompt-textarea") || document.querySelector("textarea[placeholder]") || document.querySelector(\'[contenteditable="true"][data-virtualkeyboard]\') || document.querySelector(\'main [contenteditable="true"]\');\n  }',
              '  function findComposer() {\n    return dom.findActiveComposer(document, isVisible);\n  }'
          )

          replace_once(
              'queue-v060.js',
              '  const core = globalThis.ChatGPTQueueCore;\n  const leaseGuard = globalThis.ChatGPTQueueLeaseGuard;\n  if (!core || !leaseGuard) return;',
              '  const core = globalThis.ChatGPTQueueCore;\n  const leaseGuard = globalThis.ChatGPTQueueLeaseGuard;\n  const dom = globalThis.ChatGPTDomAdapter;\n  if (!core || !leaseGuard || !dom) return;'
          )
          replace_once(
              'queue-v060.js',
              '  function findComposer() {\n    return document.querySelector("#prompt-textarea") || document.querySelector("textarea[placeholder]") || document.querySelector(\'[contenteditable="true"][data-virtualkeyboard]\') || document.querySelector(\'main [contenteditable="true"]\');\n  }',
              '  function findComposer() {\n    return dom.findActiveComposer(document, isVisible);\n  }'
          )

          replace_once(
              'tests/static.test.js',
              'assert.deepEqual(manifest.content_scripts[0].js, ["queue-lease-guard.js", "queue-core.js", "content.js", "queue-v060.js"]);',
              'assert.deepEqual(manifest.content_scripts[0].js, ["queue-lease-guard.js", "chatgpt-dom.js", "queue-core.js", "content.js", "queue-v060.js"]);'
          )
          replace_once(
              'tests/static.test.js',
              'const content = fs.readFileSync(path.join(root, "content.js"), "utf8");',
              'const domAdapter = fs.readFileSync(path.join(root, "chatgpt-dom.js"), "utf8");\nconst content = fs.readFileSync(path.join(root, "content.js"), "utf8");\nassert.ok(domAdapter.includes("findActiveComposer"), "project and conversation pages must share active-composer selection");\nassert.ok(domAdapter.includes("documentRef.activeElement"), "the focused composer must be preferred after SPA navigation");\nassert.ok(content.includes("dom.findActiveComposer(document, isVisible)"), "task tracking must use the shared active composer");'
          )
          replace_once(
              'tests/static.test.js',
              'assert.ok(queue.includes("isCurrentLeaseOwner"), "lease refresh and release must verify the exact page owner");',
              'assert.ok(queue.includes("dom.findActiveComposer(document, isVisible)"), "message queue must ignore stale hidden project composers");\nassert.ok(queue.includes("isCurrentLeaseOwner"), "lease refresh and release must verify the exact page owner");'
          )

          replace_once(
              'tests/content.test.js',
              '  querySelectorAll() { return []; }\n}',
              '  querySelectorAll() { return []; }\n  contains(node) { return node === this; }\n}'
          )
          replace_once(
              'tests/content.test.js',
              '  readyState: "complete",\n  documentElement: new FakeElement(),',
              '  readyState: "complete",\n  documentElement: new FakeElement(),\n  activeElement: composer,'
          )
          replace_once(
              'tests/content.test.js',
              '  querySelectorAll(selector) {\n    if (selector.includes(\'data-message-author-role="user"\')) return userMessages;',
              '  querySelectorAll(selector) {\n    if (selector === "#prompt-textarea" || selector === "textarea[placeholder]") return [composer];\n    if (selector.includes(\'data-message-author-role="user"\')) return userMessages;'
          )
          replace_once(
              'tests/content.test.js',
              'const location = { href: "https://chatgpt.com/", origin: "https://chatgpt.com" };',
              'const location = { href: "https://chatgpt.com/g/g-p-6a5f1944d2a88191bdee52564ce3a883-qing-gan-shi-pin-ji-neng/project", origin: "https://chatgpt.com" };'
          )
          replace_once(
              'tests/content.test.js',
              'vm.runInContext(fs.readFileSync(path.join(__dirname, "..", "content.js"), "utf8"), context, { filename: "content.js" });',
              'vm.runInContext(fs.readFileSync(path.join(__dirname, "..", "chatgpt-dom.js"), "utf8"), context, { filename: "chatgpt-dom.js" });\nvm.runInContext(fs.readFileSync(path.join(__dirname, "..", "content.js"), "utf8"), context, { filename: "content.js" });'
          )
          replace_once(
              'tests/content.test.js',
              '  location.href = "https://chatgpt.com/c/new-thread";',
              '  location.href = "https://chatgpt.com/g/g-p-6a60d644663c8191ae735ee9173602dd-windowszhong-duan/c/6a641d0e-bbb0-83e8-995e-14b42efe9c71";'
          )
          replace_once(
              'tests/content.test.js',
              '  assert.equal(calls.filter((call) => call.type === "PAGE_CHANGED").length, 0, "root-to-conversation promotion must not cancel the pending task");',
              '  assert.equal(calls.filter((call) => call.type === "PAGE_CHANGED").length, 0, "project-draft-to-conversation promotion must not cancel the pending task");'
          )
          replace_once(
              'tests/content.test.js',
              '  assert.match(calls.find((call) => call.type === "TASK_STARTED").url, /\\/c\\/new-thread/);',
              '  assert.match(calls.find((call) => call.type === "TASK_STARTED").url, /\\/c\\/6a641d0e-bbb0-83e8-995e-14b42efe9c71/);'
          )
          replace_once(
              'tests/content.test.js',
              '  location.href = "https://chatgpt.com/g/g-p-demo/c/new-thread";',
              '  location.href = "https://chatgpt.com/g/g-p-another-wrapper/c/6a641d0e-bbb0-83e8-995e-14b42efe9c71";'
          )
          replace_once('tests/content.test.js', 'content v0.6.5 lifecycle tests passed', 'content v0.6.7 lifecycle tests passed')

          replace_once(
              'tests/queue.test.js',
              'assert.equal(core.getConversationKey("https://chatgpt.com/g/g-p-demo/project", "tab-1"), "project-draft:g-p-demo:tab-1");',
              'assert.equal(core.getConversationKey("https://chatgpt.com/g/g-p-demo/project", "tab-1"), "project-draft:g-p-demo:tab-1");\nconst realProjectDraftKey = core.getConversationKey("https://chatgpt.com/g/g-p-6a5f1944d2a88191bdee52564ce3a883-qing-gan-shi-pin-ji-neng/project", "project-tab");\nconst realProjectConversationKey = core.getConversationKey("https://chatgpt.com/g/g-p-6a60d644663c8191ae735ee9173602dd-windowszhong-duan/c/6a641d0e-bbb0-83e8-995e-14b42efe9c71", "project-tab");\nassert.equal(realProjectDraftKey, "project-draft:g-p-6a5f1944d2a88191bdee52564ce3a883-qing-gan-shi-pin-ji-neng:project-tab");\nassert.equal(realProjectConversationKey, "c:6a641d0e-bbb0-83e8-995e-14b42efe9c71");\nassert.equal(core.shouldMigrateQueue(realProjectDraftKey, realProjectConversationKey), true, "a project draft queue must migrate after ChatGPT assigns the project conversation URL");'
          )
          replace_once('tests/queue.test.js', 'queue v0.6.5 tests passed', 'queue v0.6.7 tests passed')

          replace_once(
              'README.md',
              '## v0.6.6 核心变化',
              '## v0.6.7 核心变化\n\n- 修复从 ChatGPT 项目主页新建聊天后，SPA 页面残留隐藏旧输入框，导致新会话输入内容无法加入队列的问题。\n- 任务监控和消息队列统一使用活动输入框适配器：优先当前聚焦、可见且可用的输入框，并在重复挂载时选择最新可见实例。\n- 增加真实项目主页与项目会话 URL 的迁移回归测试，确保项目草稿队列能绑定到正式会话。\n\n## v0.6.6 核心变化'
          )
          replace_once(
              'CHANGELOG.md',
              '## 0.6.6 - 2026-07-25',
              '## 0.6.7 - 2026-07-25\n\n- 修复项目主页新建聊天进入正式工作页面后，旧的隐藏输入框仍留在 DOM，队列误读旧输入框而无法加入新内容的问题。\n- 新增共享活动输入框适配器，任务监控与消息队列统一优先使用聚焦、可见、可用的最新输入框。\n- 增加项目草稿地址、项目会话地址、隐藏旧输入框和重复输入框挂载的回归测试。\n\n## 0.6.6 - 2026-07-25'
          )
          PY

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          for test_file in tests/*.test.js; do node "$test_file"; done
          python3 -m json.tool manifest.json >/dev/null

      - name: Commit project chat fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-project-composer-fix.yml
          git add manifest.json content.js queue-v060.js README.md CHANGELOG.md tests/static.test.js tests/content.test.js tests/queue.test.js chatgpt-dom.js tests/dom-adapter.test.js
          git commit -m "fix: select active composer after project navigation v0.6.7"
          git push origin HEAD:fix/project-chat-active-composer
